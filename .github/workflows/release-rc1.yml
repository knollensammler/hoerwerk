name: Hörwerk 0.2.21 RC1

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-rc1.yml]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: Linux
          - runner: windows-2022
            target: Windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned build dependencies
        run: >-
          python -m pip install
          audible==0.13.1 audible-cli==0.6.0 pyinstaller==6.22.3
          pyinstaller-hooks-contrib==2026.10 imageio-ffmpeg==0.8.1
          playwright==1.65.2 miniaudio==1.73
      - name: Run source tests
        if: matrix.target == 'Linux'
        run: xvfb-run -a python -m unittest discover -q
      - name: Check Windows child-process cancellation
        if: matrix.target == 'Windows'
        run: python -m unittest test_jobs.JobTests.test_runner_cancels_download_child_process -q
      - name: Build and check packages
        run: python build_release.py --source-sha "${{ github.sha }}" --version 0.2.21 --output dist/hoerwerk
      - uses: actions/upload-artifact@v4
        with:
          name: hoerwerk-${{ matrix.target }}
          path: |
            dist/hoerwerk/Hoerwerk-0.2.21-${{ matrix.target }}-x86_64.zip
            dist/hoerwerk/*.deb
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: hoerwerk-*
          path: release
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          sha256sum Hoerwerk-0.2.21-Linux-x86_64.zip Hoerwerk-0.2.21-Windows-x86_64.zip hoerwerk_0.2.21_amd64.deb > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create v0.2.21-rc1 --target "$GITHUB_SHA" --prerelease \
            --title "Hörwerk 0.2.21 RC1" --notes-file ../RELEASE.md \
            Hoerwerk-0.2.21-Linux-x86_64.zip Hoerwerk-0.2.21-Windows-x86_64.zip hoerwerk_0.2.21_amd64.deb SHA256SUMS
